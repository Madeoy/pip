<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Pip — your pocket pet</title>
  <meta name="theme-color" content="#120d2b" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  } }
  </script>
  <style>
    :root { --ink: #fff; --ink2: rgba(255,255,255,.7); --glass: rgba(24,16,56,.62); --line: rgba(255,255,255,.16);
            --grad: linear-gradient(120deg,#7c5cff,#ff5fa2 55%,#ffb347); --safe-t: env(safe-area-inset-top,0px); --safe-b: env(safe-area-inset-bottom,0px); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #120d2b; color: var(--ink); font-family: "Baloo 2", system-ui, sans-serif; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    .panel { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + var(--safe-b)); width: min(calc(100% - 20px), 460px);
             background: var(--glass); border: 1px solid var(--line); border-radius: 28px; padding: 16px 16px 18px;
             backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3); box-shadow: 0 20px 50px rgba(0,0,0,.35); }
    .title { position: absolute; top: calc(18px + var(--safe-t)); left: 0; right: 0; text-align: center; pointer-events: none; }
    .title h1 { margin: 0; font-size: 44px; font-weight: 800; line-height: 1; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -0.02em; }
    .title p { margin: 4px 0 0; color: var(--ink2); font-size: 17px; }
    .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
    .row label { width: 62px; font-size: 15px; color: var(--ink2); }
    .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; box-shadow: inset 0 -4px 0 rgba(0,0,0,.15); }
    .swatch.on { border-color: #fff; transform: scale(1.1); }
    .chip { padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid var(--line); font-size: 15px; }
    .chip.on { background: #fff; color: #2a1b5e; font-weight: 700; }
    input.name { flex: 1; min-width: 0; font: inherit; font-size: 20px; font-weight: 700; color: #fff; background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 14px; padding: 6px 12px; outline: none; }
    .big { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 12px; padding: 14px; border-radius: 999px; background: var(--grad); font-size: 20px; font-weight: 800; box-shadow: 0 10px 30px rgba(255,95,162,.45); }
    .big.alt { background: rgba(255,255,255,.1); box-shadow: none; font-size: 17px; font-weight: 600; margin-top: 8px; }
    .note { margin: 8px 2px 0; font-size: 13px; color: var(--ink2); text-align: center; }
    /* play HUD */
    #hud .top { position: absolute; top: calc(12px + var(--safe-t)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .pill { padding: 8px 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); font-size: 16px; font-weight: 700; }
    .actions { display: flex; justify-content: space-around; align-items: center; }
    .act { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; color: var(--ink2); width: 66px; }
    .act span.i { font-size: 30px; line-height: 1.1; }
    #hud .panel { padding: 8px 12px 10px; width: min(calc(100% - 20px), 400px); }
    #hud .heard { font-size: 14px; margin-bottom: 2px; min-height: 20px; }
    #hud .help { display: none; }
    #hud .act span.i { font-size: 24px; }
    .mic { width: 60px; height: 60px; font-size: 26px !important; border-radius: 50%; background: var(--grad); display: grid; place-items: center; box-shadow: 0 0 0 4px rgba(255,255,255,.85), 0 12px 30px rgba(255,95,162,.5); font-size: 34px; transition: transform .2s; }
    .mic.on { animation: listen 1.2s ease-in-out infinite; }
    @keyframes listen { 50% { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(255,255,255,.5), 0 12px 40px rgba(255,95,162,.8); } }
    .heard { min-height: 24px; text-align: center; font-size: 16px; margin: 0 0 6px; color: var(--ink2); }
    .heard b { color: #fff; }
    #toast { position: absolute; left: 50%; top: calc(70px + var(--safe-t)); transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: rgba(0,0,0,.6); font-size: 17px; font-weight: 600; white-space: nowrap; opacity: 0; transition: opacity .3s; pointer-events: none; }
    #toast.show { opacity: 1; }
    #arrow { position: absolute; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; font-size: 26px; box-shadow: 0 6px 20px rgba(0,0,0,.4); pointer-events: none; }
    #arrow i { display: block; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 16px solid #fff; }
    .meters { display: flex; gap: 8px; padding: 6px 10px; font-size: 14px; }
    .meters span { display: flex; align-items: center; gap: 3px; }
    .meters i { display: block; width: 26px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.18); overflow: hidden; }
    .meters b { display: block; height: 100%; width: 50%; border-radius: 6px; background: #7ee08a; transition: width .5s, background .5s; }
    .status { position: absolute; left: 50%; top: calc(64px + var(--safe-t)); transform: translateX(-50%); padding: 8px 16px; border-radius: 16px; background: rgba(255,210,94,.92); color: #3a2400; font-weight: 700; font-size: 16px; white-space: nowrap; }
    .roomchip { position: absolute; right: 12px; top: calc(64px + var(--safe-t)); font-size: 14px; font-weight: 600; }
    #toast { top: auto; bottom: calc(150px + var(--safe-b)); max-width: calc(100% - 24px); white-space: normal; text-align: center; }
    #hud.voiceonly #toast, #hud.walking #toast { bottom: calc(70px + var(--safe-b)); }
    .help { font-size: 13px; color: var(--ink2); text-align: center; margin-top: 6px; }
    /* creator: compact so the pet always shows above it */
    .creator { padding: 10px 12px 12px !important; }
    .creator .row { margin: 0 0 6px; }
    .creator .name { font-size: 17px; padding: 4px 10px; }
    .dice { width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.1); font-size: 20px; flex: none; }
    .tabs { display: flex; gap: 4px; margin-bottom: 6px; }
    .tabs button { flex: 1; padding: 5px 0; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--ink2); background: rgba(255,255,255,.06); }
    .tabs button.on { background: #fff; color: #2a1b5e; }
    .tabbody { height: 128px; overflow-y: auto; overflow-x: hidden; }
    .grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .animal { width: 44px; height: 44px; border-radius: 12px; font-size: 26px; background: rgba(255,255,255,.07); border: 2px solid transparent; }
    .animal.on { border-color: #fff; background: rgba(255,255,255,.18); }
    .opt-label { font-size: 12px; color: var(--ink2); margin: 4px 0 3px; text-transform: uppercase; letter-spacing: .06em; }
    .creator .chip { padding: 4px 10px; font-size: 13px; }
    .creator .swatch { width: 28px; height: 28px; }
    .creator .big { margin-top: 8px; padding: 11px; font-size: 18px; }
    .creator .big.alt { margin-top: 6px; padding: 8px; font-size: 15px; }
    .creator .note { margin-top: 4px; font-size: 12px; }
    #create .title { top: calc(8px + var(--safe-t)); }
    #create .title h1 { font-size: 30px; }
    /* slim dock of small icons */
    .dock { position: absolute; left: 8px; right: 8px; bottom: calc(8px + var(--safe-b)); display: flex; align-items: center; gap: 8px; padding: 6px 8px;
            border-radius: 28px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .dock-scroll { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 2px 4px 2px 0; mask-image: linear-gradient(90deg, #000 85%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); }
    .dock-scroll::-webkit-scrollbar { display: none; }
    .ib { flex: none; width: 62px; height: 62px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: rgba(255,255,255,.1); scroll-snap-align: start; }
    .ib span { font-size: 28px; line-height: 1; }
    .ib small { font-size: 12px; font-weight: 700; color: var(--ink); }
    .dock .mic { width: 66px; height: 66px; font-size: 30px !important; box-shadow: 0 0 0 3px rgba(255,255,255,.85); flex: none; }
    .heard { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(92px + var(--safe-b)); margin: 0; padding: 4px 12px; border-radius: 999px; background: rgba(0,0,0,.35); font-size: 13px !important; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
    #hud .top { gap: 6px; }
    #hud .top .pill { padding: 5px 10px; font-size: 14px; }
    .meters { gap: 5px !important; }
    .meters i { width: 16px !important; height: 5px !important; }
    .meters span { font-size: 12px; }
    .status { top: calc(52px + var(--safe-t)) !important; font-size: 13px !important; padding: 5px 12px !important; }
    .roomchip { top: calc(52px + var(--safe-t)) !important; font-size: 12px !important; left: 12px; right: auto !important; }
    #toast { bottom: calc(126px + var(--safe-b)) !important; font-size: 15px !important; }
    .sheet { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; background: rgba(6,4,20,.5); }
    .sheet-card { width: min(100%, 440px); max-height: 70vh; overflow: auto; margin: 0 8px calc(8px + var(--safe-b)); padding: 14px 16px; border-radius: 24px; background: #1d1545; border: 1px solid var(--line); }
    .sheet-card h3 { margin: 0 0 8px; font-size: 20px; }
    .trick-row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
    .trick-row small { color: var(--ink2); }
    .trick-row span:last-child { color: #ffd25e; white-space: nowrap; }
    #hud.walking .dock, #hud.walking .top, #hud.walking .roomchip, #hud.walking .status, #hud.walking .heard,
    #hud.voiceonly .dock, #hud.voiceonly .top, #hud.voiceonly .roomchip, #hud.voiceonly .status, #hud.voiceonly .heard { display: none !important; }
    #hud.voiceonly.walking #walkOff { display: none !important; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <video id="camfeed" playsinline muted autoplay hidden style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover"></video>
  <canvas id="c"></canvas>
  <div id="ui">
    <!-- CREATE -->
    <div id="create">
      <div class="title"><h1>Make your pet</h1></div>
      <div class="panel creator">
        <div class="row"><input class="name" id="name" maxlength="14" value="Pip" aria-label="Name" /><button class="dice" id="randomBtn" aria-label="Surprise me">🎲</button></div>
        <div class="tabs" id="tabs">
          <button data-tab="pets">My pets</button><button data-tab="animal" class="on">Animal</button><button data-tab="colors">Colors</button><button data-tab="parts">Parts</button><button data-tab="style">Style</button>
        </div>
        <div class="tabbody" id="tabbody"></div>
        <button class="big" id="goAR" hidden>Bring it into my room</button>
        <button class="big" id="goPlay">Bring it to life</button>
        <p class="note" id="arNote"></p>
      </div>
    </div>
    <!-- PLAY -->
    <div id="hud" hidden>
      <div class="top">
        <div class="pill" id="petName" role="button">Pip</div>
        <div class="meters pill" id="meters">
          <span title="Food">🥕<i><b id="mHunger"></b></i></span>
          <span title="Water">💧<i><b id="mThirst"></b></i></span>
          <span title="Energy">⚡<i><b id="mEnergy"></b></i></span>
          <span title="Happy">💖<i><b id="mFun"></b></i></span>
        </div>
        <div class="pill" id="exitBtn" role="button">✕</div>
      </div>
      <div class="pill" id="voiceOff" role="button" hidden style="position:absolute;left:10px;bottom:calc(10px + var(--safe-b));font-size:13px;opacity:.8;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">🎤 <span id="voiceHeard">Listening…</span> ⌃</div>
      <div class="pill" id="walkOff" role="button" hidden style="position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safe-b))">👣 Walking together · tap for controls</div>
      <div class="status" id="status" hidden></div>
      <div class="pill roomchip" id="roomChip" hidden>🏠 <span id="roomCount">0</span> spots learned</div>
      <div id="toast"></div>
      <div id="arrow" hidden><i></i></div>
      <p class="heard" id="heard">Tap 🎤 and talk to <b class="pn">Pip</b></p>
      <div class="dock" id="dock">
        <button class="mic" id="micBtn" aria-label="Talk">🎤</button>
        <div class="dock-scroll">
          <button class="ib" id="ballBtn"><span>🎾</span><small>Ball</small></button>
          <button class="ib" id="treatBtn"><span>🦴</span><small>Treat</small></button>
          <button class="ib" id="waterBtn"><span>🍽️</span><small>Food</small></button>
          <button class="ib" id="bedBtn"><span>🛏️</span><small>Bed</small></button>
          <button class="ib" id="hideBtn"><span>🙈</span><small>Hide</small></button>
          <button class="ib" id="walkBtn"><span>👣</span><small>Walk</small></button>
          <button class="ib" id="tricksBtn"><span>📋</span><small>Tricks</small></button>
          <button class="ib" id="voiceOnlyBtn"><span>🙌</span><small>Hide UI</small></button>
        </div>
      </div>
      <div class="sheet" id="tricksSheet" hidden>
        <div class="sheet-card">
          <h3>Things to say to <span class="pn">Pip</span></h3>
          <div id="tricksList"></div>
          <button class="big alt" id="tricksClose">Done</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
