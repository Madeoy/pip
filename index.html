<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Pip — your pocket pet</title>
  <meta name="theme-color" content="#120d2b" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  } }
  </script>
  <style>
    :root { --ink: #fff; --ink2: rgba(255,255,255,.7); --glass: rgba(24,16,56,.62); --line: rgba(255,255,255,.16);
            --grad: linear-gradient(120deg,#7c5cff,#ff5fa2 55%,#ffb347); --safe-t: env(safe-area-inset-top,0px); --safe-b: env(safe-area-inset-bottom,0px); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #120d2b; color: var(--ink); font-family: "Baloo 2", system-ui, sans-serif; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    .panel { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + var(--safe-b)); width: min(calc(100% - 20px), 460px);
             background: var(--glass); border: 1px solid var(--line); border-radius: 28px; padding: 16px 16px 18px;
             backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3); box-shadow: 0 20px 50px rgba(0,0,0,.35); }
    .title { position: absolute; top: calc(18px + var(--safe-t)); left: 0; right: 0; text-align: center; pointer-events: none; }
    .title h1 { margin: 0; font-size: 44px; font-weight: 800; line-height: 1; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -0.02em; }
    .title p { margin: 4px 0 0; color: var(--ink2); font-size: 17px; }
    .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
    .row label { width: 62px; font-size: 15px; color: var(--ink2); }
    .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; box-shadow: inset 0 -4px 0 rgba(0,0,0,.15); }
    .swatch.on { border-color: #fff; transform: scale(1.1); }
    .chip { padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid var(--line); font-size: 15px; }
    .chip.on { background: #fff; color: #2a1b5e; font-weight: 700; }
    input.name { flex: 1; min-width: 0; font: inherit; font-size: 20px; font-weight: 700; color: #fff; background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 14px; padding: 6px 12px; outline: none; }
    .big { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 12px; padding: 14px; border-radius: 999px; background: var(--grad); font-size: 20px; font-weight: 800; box-shadow: 0 10px 30px rgba(255,95,162,.45); }
    .big.alt { background: rgba(255,255,255,.1); box-shadow: none; font-size: 17px; font-weight: 600; margin-top: 8px; }
    .note { margin: 8px 2px 0; font-size: 13px; color: var(--ink2); text-align: center; }
    /* play HUD */
    #hud .top { position: absolute; top: calc(12px + var(--safe-t)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .pill { padding: 8px 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); font-size: 16px; font-weight: 700; }
    .actions { display: flex; justify-content: space-around; align-items: center; }
    .act { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; color: var(--ink2); width: 66px; }
    .act span.i { font-size: 30px; line-height: 1.1; }
    .mic { width: 78px; height: 78px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; box-shadow: 0 0 0 4px rgba(255,255,255,.85), 0 12px 30px rgba(255,95,162,.5); font-size: 34px; transition: transform .2s; }
    .mic.on { animation: listen 1.2s ease-in-out infinite; }
    @keyframes listen { 50% { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(255,255,255,.5), 0 12px 40px rgba(255,95,162,.8); } }
    .heard { min-height: 24px; text-align: center; font-size: 16px; margin: 0 0 6px; color: var(--ink2); }
    .heard b { color: #fff; }
    #toast { position: absolute; left: 50%; top: calc(70px + var(--safe-t)); transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: rgba(0,0,0,.6); font-size: 17px; font-weight: 600; white-space: nowrap; opacity: 0; transition: opacity .3s; pointer-events: none; }
    #toast.show { opacity: 1; }
    #arrow { position: absolute; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; font-size: 26px; box-shadow: 0 6px 20px rgba(0,0,0,.4); pointer-events: none; }
    #arrow i { display: block; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 16px solid #fff; }
    .meters { display: flex; gap: 8px; padding: 6px 10px; font-size: 14px; }
    .meters span { display: flex; align-items: center; gap: 3px; }
    .meters i { display: block; width: 26px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.18); overflow: hidden; }
    .meters b { display: block; height: 100%; width: 50%; border-radius: 6px; background: #7ee08a; transition: width .5s, background .5s; }
    .status { position: absolute; left: 50%; top: calc(64px + var(--safe-t)); transform: translateX(-50%); padding: 8px 16px; border-radius: 16px; background: rgba(255,210,94,.92); color: #3a2400; font-weight: 700; font-size: 16px; white-space: nowrap; }
    .roomchip { position: absolute; right: 12px; top: calc(64px + var(--safe-t)); font-size: 14px; font-weight: 600; }
    #toast { top: calc(110px + var(--safe-t)); }
    .help { font-size: 13px; color: var(--ink2); text-align: center; margin-top: 6px; }
    #hud.walking .panel, #hud.walking .top, #hud.walking .roomchip, #hud.walking .status { display: none !important; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <video id="camfeed" playsinline muted autoplay hidden style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover"></video>
  <canvas id="c"></canvas>
  <div id="ui">
    <!-- CREATE -->
    <div id="create">
      <div class="title"><h1>Make your pet</h1><p>It listens, learns tricks… and hides.</p></div>
      <div class="panel">
        <div class="row"><label>Name</label><input class="name" id="name" maxlength="14" value="Pip" /></div>
        <div class="row" id="colors"><label>Color</label></div>
        <div class="row" id="ears"><label>Ears</label></div>
        <div class="row" id="eyes"><label>Eyes</label></div>
        <button class="big" id="goAR" hidden>Bring it into my room</button>
        <button class="big" id="goPlay">Bring it to life</button>
        <p class="note" id="arNote"></p>
      </div>
    </div>
    <!-- PLAY -->
    <div id="hud" hidden>
      <div class="top">
        <div class="pill" id="petName" role="button">Pip</div>
        <div class="meters pill" id="meters">
          <span title="Food">🍪<i><b id="mHunger"></b></i></span>
          <span title="Water">💧<i><b id="mThirst"></b></i></span>
          <span title="Energy">⚡<i><b id="mEnergy"></b></i></span>
          <span title="Happy">💖<i><b id="mFun"></b></i></span>
        </div>
        <div class="pill" id="walkBtn" role="button" title="Walk together">👣</div>
        <div class="pill" id="exitBtn" role="button">✕</div>
      </div>
      <div class="pill" id="walkOff" role="button" hidden style="position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safe-b))">👣 Walking together · tap for controls</div>
      <div class="status" id="status" hidden></div>
      <div class="pill roomchip" id="roomChip" hidden>🏠 <span id="roomCount">0</span> spots learned</div>
      <div id="toast"></div>
      <div id="arrow" hidden><i></i></div>
      <div class="panel">
        <p class="heard" id="heard">Tap the mic and talk to <b class="pn">Pip</b></p>
        <div class="actions">
          <button class="act" id="ballBtn"><span class="i">🎾</span>Ball</button>
          <button class="act" id="treatBtn"><span class="i">🍪</span>Treat</button>
          <button class="mic" id="micBtn" aria-label="Talk">🎤</button>
          <button class="act" id="waterBtn"><span class="i">🥣</span>Water</button>
          <button class="act" id="hideBtn"><span class="i">🙈</span>Hide</button>
        </div>
        <p class="help" id="help">Say: come · sit · spin · jump · get your ball · hide · nap · good job</p>
      </div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
